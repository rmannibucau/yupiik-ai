name: deploy-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -q -T1C -Daether.connector.basic.downstreamThreads=128

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # composite action: checkout + JDK + maven cache + install (from Maven Central)
      - name: Setup Maven Action
        # pinned to the PR #173 merge commit (jdk-file input) to drop the setup-java
        # deprecation warning; base version v1.21.0. Move back to a tagged release (>=1.22.0) once available.
        uses: s4u/setup-maven-action@8da9a2ce045f6f610f43985a87a62f256e963374
        with:
          maven-version: '4.0.0-rc-7'
          java-version: '25'
          java-distribution: temurin
          # full history so spotless ratchet (ratchetFrom=origin/main) finds its merge base
          checkout-fetch-depth: '0'

      # tests are skipped here - the build.yml/pr.yml workflows already run them
      # install the reactor so the documentation module resolves its subproject deps
      # (core/tui/web, used by the minisite preActions) from the local repo
      - name: Build reactor
        run: mvn ${MAVEN_ARGS} install -DskipTests

      # the documentation minisite execution is bound to phase=none so it must be invoked
      # explicitly; the output dir is ${project.build.directory}/${project.build.finalName}
      - name: Build minisite
        run: |
          echo "SITE_DIR=documentation/target/$(mvn ${MAVEN_ARGS} -pl documentation -DskipTests help:evaluate -Dexpression=project.build.finalName -q -DforceStdout)" >> "$GITHUB_ENV"
          mvn ${MAVEN_ARGS} -pl documentation io.yupiik.maven:yupiik-tools-maven-plugin:minisite

      # configure GitHub Pages + upload the rendered site as a Pages artifact
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4