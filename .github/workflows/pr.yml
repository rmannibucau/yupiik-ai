name: build-pr

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -q -T1C -Daether.connector.basic.downstreamThreads=128

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # composite action: checkout + JDK + maven cache + maven install (from Maven Central)
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          maven-version: '4.0.0-rc-7'
          java-version: '25'
          java-distribution: temurin
          # full history + pin to the PR head commit
          checkout-fetch-depth: '0'
          checkout-ref: ${{ github.event.pull_request.head.sha }}

      # checkout on a pull_request event only populates the merge ref (refs/pull/N/merge),
      # so refs/remotes/origin/main is still absent and spotless ratchetFrom would fail
      # with "No such reference 'origin/main'". Cheap with fetch-depth: 0 (objects present).
      - name: Populate origin/main for spotless ratchet
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Build
        run: mvn ${MAVEN_ARGS} verify