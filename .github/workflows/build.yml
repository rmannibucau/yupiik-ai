name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -q -T1C -Daether.connector.basic.downstreamThreads=128

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # composite action: checkout + JDK + maven cache + maven install (from Maven Central)
      - name: Setup Maven Action
        # pinned to the PR #173 merge commit (jdk-file input) to drop the setup-java
        # deprecation warning; base version v1.21.0. Move back to a tagged release (>=1.22.0) once available.
        uses: s4u/setup-maven-action@8da9a2ce045f6f610f43985a87a62f256e963374
        with:
          maven-version: '4.0.0-rc-7'
          java-version: '25'
          java-distribution: temurin
          # full history so spotless ratchet (ratchetFrom=origin/main) finds its merge base
          checkout-fetch-depth: '0'

      - name: Build
        run: mvn ${MAVEN_ARGS} verify